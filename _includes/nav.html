<!-- Navigation -->
{% if page.nav-style == "invert" or page.header-style == "text" %}
<nav class="navbar navbar-expand-md navbar-custom fixed-top invert">
{% else %}
<nav class="navbar navbar-expand-md navbar-custom fixed-top">
{% endif %}
    <div class="container-fluid">
        <!-- Brand and toggle get grouped for better mobile display -->
        <a class="navbar-brand" href="{{ site.baseurl }}/">{{ site.title }}</a>
        <button type="button" class="navbar-toggler" aria-label="Toggle navigation" aria-controls="huxblog_navbar" aria-expanded="false">
            <span class="visually-hidden">Toggle navigation</span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
        </button>

        <!-- Collect the nav links, forms, and other content for toggling -->
        <div id="huxblog_navbar" class="navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{{ site.baseurl }}/">Home</a>
                </li>
                {% for page in site.pages %}
                {% if page.title and page.hide-in-nav != true %}
                <li class="nav-item">
                    <a class="nav-link" href="{{ page.url | prepend: site.baseurl }}">{{ page.title }}</a>
                </li>
                {% endif %}
                {% endfor %}
            </ul>
        </div>
        <!-- /.navbar-collapse -->
    </div>
    <!-- /.container -->
</nav>
<script>
    // Drop Bootstarp low-performance Navbar
    // Use customize navbar with high-quality material design animation
    // in high-perf jank-free CSS3 implementation
    var $toggle = document.querySelector('.navbar-toggler');
    var $navbar = document.querySelector('#huxblog_navbar');

    var __HuxNav__ = {
        close: function(){
            $navbar.classList.remove('in');
            $toggle.setAttribute('aria-expanded', 'false');
            // wait until animation end.
            setTimeout(function(){
                // prevent frequently toggle
                if(!$navbar.classList.contains('in')) {
                    $navbar.style.height = "0px"
                }
            },400)
        },
        open: function(){
            $navbar.style.height = "auto"
            $navbar.classList.add('in');
            $toggle.setAttribute('aria-expanded', 'true');
        }
    }

    // Bind Event
    $toggle.addEventListener('click', function(){
        if ($navbar.classList.contains('in')) {
            __HuxNav__.close()
        }else{
            __HuxNav__.open()
        }
    })

    /**
     * Since Fastclick is used to delegate 'touchstart' globally
     * to hack 300ms delay in iOS by performing a fake 'click',
     * Using 'e.stopPropagation' to stop 'touchstart' event from 
     * $toggle/$collapse will break global delegation.
     * 
     * Instead, we use a 'e.target' filter to prevent handler
     * added to document close HuxNav.  
     *
     * Also, we use 'click' instead of 'touchstart' as compromise
     */
    document.addEventListener('click', function(e){
        if(e.target === $toggle || $toggle.contains(e.target)) return;
        __HuxNav__.close();
    })
</script>
